name: Cross-platform onboarding

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install-check-uninstall:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        hermes_ref:
          - 2be183142c6dd9ac309b6db5b783af5e25c3be18
          - main
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Check out supported Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes_ref }}
          path: hermes-agent

      - name: Run installer unit tests
        run: python -m unittest discover -s tests -v

      - name: Install through macOS/Linux wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: bash install.sh --hermes-dir "$PWD/hermes-agent" --yes

      - name: Install through Windows wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -HermesDir (Resolve-Path ./hermes-agent) -Yes

      - name: Verify installed state
        run: python install.py --hermes-dir hermes-agent --check

      - name: Install focused integration-test dependencies
        run: python -m pip install pytest PyYAML==6.0.3

      - name: Run profile-scope integration tests
        run: python -m pytest hermes-agent/tests/plugins/test_achievements_plugin.py -q

      - name: Uninstall and verify exact rollback
        run: python install.py --hermes-dir hermes-agent --uninstall --yes

      - name: Require a clean Hermes checkout
        run: git -C hermes-agent diff --exit-code
